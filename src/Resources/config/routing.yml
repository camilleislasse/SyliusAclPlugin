bitbag_sylius_acl_admin_role:
    resource: |
        alias: bitbag_sylius_acl_plugin.role
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        redirect: update
        grid: bitbag_sylius_acl_plugin_admin_role
        except: ['show']
        permission: true
        vars:
            all:
                header: bitbag_sylius_acl_plugin.ui.role_header
                subheader: bitbag_sylius_acl_plugin.ui.role_subheader
                templates:
                    form: "@BitBagSyliusAclPlugin/Admin/Role/_form.html.twig"
            index:
                icon: key icon
    type: sylius.resource
    prefix: /admin
