sylius_grid:
    grids:
        bitbag_sylius_acl_plugin_admin_role:
            driver:
                name: doctrine/orm
                options:
                    class: "%bitbag_sylius_acl_plugin.model.role.class%"
                    repository:
                        method: createListQueryBuilder
                        arguments: ["%locale%"]
            fields:
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: ~
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [code, translation.name]
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
